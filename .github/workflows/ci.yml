name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Schema upgrade smoke test diffs server/schema/ against origin/main.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      # Pinned and built from crates.io with --locked instead of piping an
      # unpinned `releases/latest` installer script into sh. The binary is
      # cached per version so the build only runs when the version changes.
      - name: Cache specre CLI
        id: specre-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/specre
          key: specre-cli-${{ runner.os }}-v0.5.0

      - name: Install specre CLI
        if: steps.specre-cache.outputs.cache-hit != 'true'
        run: cargo install specre --version 0.5.0 --locked

      - name: Add cargo bin to PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/specre" --version

      - name: Lint
        run: bun run check:lint

      - name: Typecheck
        run: bun run check:type

      - name: Test
        run: bun run check:test

      - name: Schema upgrade smoke test
        run: bun run --filter '@auto-kanban/server' check:schema-upgrade

      - name: Architecture check
        run: bun run check:arch

      - name: specre health check
        run: bun run check:specre
